name: Dependabot auto-merge

# Minor and patch updates merge on their own once CI passes; majors wait for a
# person. Dependency updates don't change the published bundles, so they add
# no changeset and release nothing. They prove the plugins still work against
# the newest oxlint.
on: pull_request

permissions:
    contents: read

jobs:
    auto-merge:
        name: Enable auto-merge
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        runs-on: ubuntu-latest
        steps:
            - id: metadata
              uses: dependabot/fetch-metadata@v3

            # A merge made with GITHUB_TOKEN wouldn't trigger CI or the release
            # workflow on main, so merge as the release app instead.
            - id: app-token
              if: steps.metadata.outputs.update-type != 'version-update:semver-major'
              uses: actions/create-github-app-token@v3
              with:
                  app-id: ${{ secrets.RELEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

            - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
              run: gh pr merge --auto --squash "$PR_URL"
              env:
                  PR_URL: ${{ github.event.pull_request.html_url }}
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
