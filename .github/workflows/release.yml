name: Release

# On every push to main, changesets/action does one of two things:
#   - pending changesets → opens (or updates) a "chore: release" PR that bumps
#     versions and writes CHANGELOGs, and turns on auto-merge for it
#   - no pending changesets → publishes any plugin whose version isn't on the
#     registry yet, then tags it and creates a GitHub release
on:
    push:
        branches: [main]

permissions:
    contents: read

# Never cancel a release half-way through publishing.
concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        name: Version or publish
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            # Pushes, PRs and merges made with the default GITHUB_TOKEN don't
            # trigger other workflows, so the release PR would never get CI
            # and its merge would never reach this workflow. The app's token does.
            - id: app-token
              uses: actions/create-github-app-token@v3
              with:
                  client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm
                  registry-url: https://npm.pkg.github.com
                  scope: '@ajrsoftware'

            - run: pnpm install --frozen-lockfile

            - id: changesets
              uses: changesets/action@v2
              with:
                  github-token: ${{ steps.app-token.outputs.token }}
                  publish-script: pnpm release
                  commit-message: 'chore: release'
                  pr-title: 'chore: release'
              env:
                  # GitHub Packages accepts the workflow's own token for publishing.
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # Merges once CI passes on the release PR, which publishes on the
            # next run of this workflow. Remove this step to review releases by hand.
            - name: Auto-merge the release PR
              if: steps.changesets.outputs.pr-number != ''
              run: gh pr merge --auto --squash "$PR_NUMBER"
              env:
                  PR_NUMBER: ${{ steps.changesets.outputs.pr-number }}
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
